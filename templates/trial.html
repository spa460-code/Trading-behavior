<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Simulator — Stock {{ n + 1 }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="terminal">
    <div class="topbar">
      <div class="brand">MARKET&nbsp;SIM <span class="live">● LIVE</span></div>
      <div class="progress">Stock {{ n + 1 }} / {{ total }}</div>
    </div>

    <div class="stocks">
      <div class="stock single">
        <div class="ticker">STOCK&nbsp;{{ 'ABCDEFGHIJKL'[n] }}</div>
        <div class="prices">
          {% for p in prices %}{% if not loop.first %}<span class="arrow">→</span>{% endif %}<span class="px">${{ "%.*f" | format(decimals, p) }}</span>{% endfor %}
        </div>
      </div>
    </div>

    <form id="trialForm" method="post" action="{{ url_for('trial', n=n) }}">
      <input type="hidden" name="rt_ms" id="rt_ms" value="">
      <input type="hidden" name="choice" id="choice" value="">
      <div class="qblock">
        <div class="qtext">What do you do with this stock?</div>
        <div class="choices">
          <button type="button" class="choice sell" data-v="S">Sell some of my shares</button>
          <button type="button" class="choice buy"  data-v="B">Buy more shares</button>
        </div>
      </div>
      <button class="btn" type="submit" id="nextBtn" disabled>Continue →</button>
    </form>
  </div>

  <script>
    const t0 = performance.now();
    const choiceIn = document.getElementById("choice"), nextBtn = document.getElementById("nextBtn");
    document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll(".choice").forEach(x => x.classList.remove("on")); b.classList.add("on");
      choiceIn.value = b.dataset.v; nextBtn.disabled = false;
    }));
    document.getElementById("trialForm").addEventListener("submit", e => {
      if (!choiceIn.value) { e.preventDefault(); return; }
      document.getElementById("rt_ms").value = Math.round(performance.now() - t0);
    });
  </script>
</body>
</html>
